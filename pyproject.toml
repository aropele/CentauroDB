[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "centaurodb"
version = "0.9.0"
description = "Pydantic-native storage for time-series and evolving data models. SQLite + PostgreSQL, schema evolution without migrations, built-in Polars."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Andrea Ropele" }]
keywords = [
    "pydantic",
    "orm",
    "database",
    "time-series",
    "sqlite",
    "postgres",
    "polars",
    "schema-evolution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
polars = ["polars>=1.38.1"]

[project.urls]
Homepage = "https://github.com/aropele/centaurodb"
Documentation = "https://centaurodb.dev"
Repository = "https://github.com/aropele/centaurodb"
Issues = "https://github.com/aropele/centaurodb/issues"
Changelog = "https://github.com/aropele/centaurodb/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/centaurodb"]

[tool.hatch.build.targets.sdist]
include = [
    "src/centaurodb",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]
markers = [
    "perf: performance regression baselines (generous bounds, not micro-benchmarks)",
]

[tool.coverage.run]
source = ["src/centaurodb"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src/centaurodb"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = "error"

[dependency-groups]
dev = [
    "polars>=1.38.1",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
]
